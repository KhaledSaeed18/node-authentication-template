version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for all minor/patch bumps, majors still come one by one
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types follow the Node version the app runs on (.nvmrc, engines, Docker image);
      # bump them together with the runtime instead
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Upgrade the Node runtime deliberately, together with .nvmrc, types and CI.
      # Minor and patch updates within the supported major still apply.
      - dependency-name: "docker/library/node"
        update-types: ["version-update:semver-major"]
