name: Documentation
description: Something in the docs is missing, wrong or unclear
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where?
      description: File, section or URL (README, CONTRIBUTING, /docs, code comment, ...).
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
