name: Container

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: node-auth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          load: true
          tags: node-auth-migrate:ci
          cache-from: type=gha

      # Migrate a real database with the migration image, then the API image must start,
      # pass its own health check and report ready (database and signing keys)
      - name: Smoke test
        run: |
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/auth
          docker run --rm --network host -e DATABASE_URL=$DATABASE_URL node-auth-migrate:ci
          docker run -d --name api --network host \
            -e DATABASE_URL=$DATABASE_URL \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            node-auth:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs api
          test "$(docker inspect --format '{{.State.Health.Status}}' api)" = "healthy"
          curl -fsS http://localhost:4000/ready
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep node-auth

      - name: Scan for vulnerabilities (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: node-auth:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: container

      # Fails the build on critical vulnerabilities that have a fix available
      - name: Scan for vulnerabilities (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: node-auth:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_SKIP_DB_UPDATE: "true"

      - name: Software bill of materials
        uses: anchore/sbom-action@v0.24.3
        with:
          image: node-auth:ci
          format: spdx-json
          artifact-name: sbom.spdx.json
