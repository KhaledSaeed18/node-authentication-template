name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. Endpoints, request/response shapes or configuration are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts (signup, verification, passwords)
        - Two-factor authentication
        - Sessions and tokens
        - Users and roles
        - Email
        - API docs
        - Deployment (Docker, configuration)
        - Developer experience (tooling, tests, CI)
        - Other
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could this feature weaken anything (enumeration, brute force, token handling)? How would you prevent it?

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself.
